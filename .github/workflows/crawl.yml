name: Daily Job Crawler

on:
  schedule:
    - cron: '0 */2 * * *'    # Every 2 hours (a run takes ~25-30 min; all DB workflows share one lock)
  workflow_dispatch:         # Manual trigger from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download latest DB from GitHub Release
        working-directory: backend
        run: |
          # Never start from an empty DB: if the release can't be downloaded, stop.
          curl -fL --retry 5 --retry-delay 15 -o db.sqlite3.gz "https://github.com/abhay1verma5/project-alpha/releases/download/db-v1/db.sqlite3.gz"
          gunzip -f db.sqlite3.gz
          python3 scripts/db_fingerprint.py db.sqlite3 > /tmp/db_before.fp
          python3 scripts/db_fingerprint.py db.sqlite3 --counts > /tmp/db_before_counts.json
          echo "start of run: $(cat /tmp/db_before_counts.json | head -c 400)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --no-input
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

      # Two steps: the aggregators (answer keys, admissions, syllabus, results)
      # used to sit at the end of one 15-minute step and never ran because slow
      # .gov.in sites used up the time. python -u so logs survive a timeout.
      - name: Crawl aggregator sources
        run: timeout 600 python -u manage.py crawl_jobs --group aggregators 2>&1 || echo "[DONE] aggregators"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: 'False'

      - name: Crawl official sources
        run: timeout 900 python -u manage.py crawl_jobs --group official 2>&1 || echo "[DONE] official"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: 'False'

      - name: Deactivate dead listings
        if: ${{ !cancelled() }}
        run: timeout 300 python manage.py deactivate_dead_jobs 2>&1
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

      - name: Re-categorize jobs
        run: timeout 120 python manage.py recategorize_jobs --all 2>&1 || echo "[DONE]"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

      - name: Backfill organization names
        run: timeout 120 python manage.py backfill_organization 2>&1 || echo "[DONE]"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

      - name: Crawl current affairs
        run: timeout 120 python manage.py crawl_current_affairs --days 2 2>&1 || echo "[DONE] current affairs crawled"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Backfill Hindi titles
        run: timeout 120 python manage.py backfill_hindi 2>&1 || echo "[DONE]"
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

      - name: Show crawl stats
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          python -c "
          import django, os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from jobs.models import Job
          from django.db.models import Count
          total = Job.objects.count()
          active = Job.objects.filter(is_active=True).count()
          print(f'Total jobs: {total} | Active: {active}')
          by_type = Job.objects.values('content_type').annotate(c=Count('id')).order_by('-c')
          for t in by_type:
              print(f'  {t[\"content_type\"]}: {t[\"c\"]}')
          "


      # Upload + Render redeploy ONLY if this run changed data (see .github/scripts/publish_db.sh)
      - name: Publish DB if changed
        if: ${{ !cancelled() }}
        working-directory: backend
        run: bash ../.github/scripts/publish_db.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
