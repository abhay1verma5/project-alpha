name: Deploy Frontend

# Netlify auto-deploys from GitHub on push to frontend/.
# This workflow is only for manual re-deploys.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://job-search-backend-nhz4.onrender.com/api
          NEXT_PUBLIC_SITE_URL: https://sarkarialert.online

      - name: Deploy to Netlify
        working-directory: frontend
        run: npx netlify-cli deploy --prod --dir=.next
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
