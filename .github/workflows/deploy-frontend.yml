name: Deploy Frontend

# Deploy to Cloudflare Workers via wrangler CLI.
# Runs on push to frontend/ or manual trigger.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and deploy to Cloudflare Workers
        working-directory: frontend
        run: npx @opennextjs/cloudflare build && npx wrangler deploy
        env:
          NEXT_PUBLIC_API_URL: https://job-search-backend-nhz4.onrender.com/api
          NEXT_PUBLIC_SITE_URL: https://sarkarialert.online
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
