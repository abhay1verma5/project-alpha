name: PYQ import (open datasets)

# Daily at 01:15 UTC: pull real previous-year questions from the open sources
# listed in backend/pyq/import_sources.py and commit the database.
on:
  schedule:
    - cron: '40 * * * *'    # Every hour at :40
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Import from open datasets
        run: python manage.py import_pyq_json

      - name: Import GATE official papers (latest year; dedupes on re-run)
        run: python manage.py import_gate_pdfs

      - name: Commit database
        working-directory: .
        run: |
          git config user.name "abhay1verma5"
          git config user.email "abhaykumarverma910@gmail.com"
          git add backend/db.sqlite3 --force
          if git diff --cached --quiet; then
            echo "No new questions"
          else
            git commit -m "chore: import PYQs $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi

      - name: Update GitHub Release DB
        working-directory: backend
        run: |
          gzip -c db.sqlite3 > db.sqlite3.gz
          gh release upload db-v1 db.sqlite3.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Render redeploy
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
