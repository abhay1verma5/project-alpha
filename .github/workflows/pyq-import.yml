name: PYQ import (open datasets)

# Daily at 01:15 UTC: pull real previous-year questions from the open sources
# listed in backend/pyq/import_sources.py and commit the database.
on:
  schedule:
    - cron: '40 21 * * *'   # Daily 03:10 IST (the open datasets rarely change)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Download latest DB from GitHub Release
        working-directory: backend
        run: |
          # Never start from an empty DB: if the release can't be downloaded, stop.
          curl -fL --retry 5 --retry-delay 15 -o db.sqlite3.gz "https://github.com/abhay1verma5/project-alpha/releases/download/db-v1/db.sqlite3.gz"
          gunzip -f db.sqlite3.gz
          python3 scripts/db_fingerprint.py db.sqlite3 > /tmp/db_before.fp
          python3 scripts/db_fingerprint.py db.sqlite3 --counts > /tmp/db_before_counts.json
          echo "start of run: $(cat /tmp/db_before_counts.json | head -c 400)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Import from open datasets
        run: python manage.py import_pyq_json

      - name: Import GATE official papers (latest year; dedupes on re-run)
        run: python manage.py import_gate_pdfs


      # Upload + Render redeploy ONLY if this run changed data (see .github/scripts/publish_db.sh)
      - name: Publish DB if changed
        if: ${{ !cancelled() }}
        working-directory: backend
        run: bash ../.github/scripts/publish_db.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
