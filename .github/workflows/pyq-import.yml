name: PYQ import (open datasets)

# Daily at 01:15 UTC: pull real previous-year questions from the open sources
# listed in backend/pyq/import_sources.py and commit the database.
on:
  schedule:
    - cron: '40 * * * *'    # Every hour at :40
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Download latest DB from GitHub Release
        working-directory: backend
        run: |
          curl -fL -o db.sqlite3.gz "https://github.com/abhay1verma5/project-alpha/releases/download/db-v1/db.sqlite3.gz" || true
          [ -f db.sqlite3.gz ] && gunzip -f db.sqlite3.gz || echo "No release DB found, starting fresh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Import from open datasets
        run: python manage.py import_pyq_json

      - name: Import GATE official papers (latest year; dedupes on re-run)
        run: python manage.py import_gate_pdfs

      - name: Validate and upload DB to GitHub Release
        working-directory: backend
        run: |
          TOTAL=$(python -c "
          import django, os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from pyq.models import ExamQuestion
          print(ExamQuestion.objects.count())
          " 2>/dev/null || echo "0")
          echo "PYQ questions in DB: $TOTAL"
          if [ "$TOTAL" -gt 0 ]; then
            gzip -c db.sqlite3 > db.sqlite3.gz
            gh release upload db-v1 db.sqlite3.gz --clobber
            echo "✅ Uploaded DB with $TOTAL PYQ questions"
          else
            echo "⚠️ DB has 0 questions — skipping upload to protect existing release"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

      - name: Trigger Render redeploy
        if: success()
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
