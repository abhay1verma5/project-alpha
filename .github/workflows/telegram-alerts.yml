name: Telegram alerts

# Daily at 08:30 IST (03:00 UTC): new notices to subscribers + "closing soon" reminders.
on:
  schedule:
    - cron: '45 1-23/3 * * *'  # Every 3 hours at :45
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-push
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

    steps:
      - uses: actions/checkout@v4

      # This workflow used to run on an EMPTY database (it never downloaded the
      # release DB), so PDF last-date extraction and alerts did nothing.
      - name: Download latest DB from GitHub Release
        run: |
          # Never start from an empty DB: if the release can't be downloaded, stop.
          curl -fL --retry 5 --retry-delay 15 -o db.sqlite3.gz "https://github.com/abhay1verma5/project-alpha/releases/download/db-v1/db.sqlite3.gz"
          gunzip -f db.sqlite3.gz
          python3 scripts/db_fingerprint.py db.sqlite3 > /tmp/db_before.fp
          python3 scripts/db_fingerprint.py db.sqlite3 --counts > /tmp/db_before_counts.json
          echo "start of run: $(cat /tmp/db_before_counts.json | head -c 400)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Fill last dates from notification PDFs
        run: timeout 1200 python manage.py extract_pdf_dates --apply --limit 60 2>&1 || echo "[DONE]"

      - name: Re-categorize and backfill qualification
        run: timeout 120 python manage.py recategorize_jobs --all 2>&1 || echo "[DONE]"

      - name: Channel alerts for new notices
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: python manage.py send_telegram_alerts

      - name: Closing-soon reminders to subscribers
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: python manage.py send_deadline_reminders

      # Upload + Render redeploy ONLY if this run changed data (see .github/scripts/publish_db.sh)
      - name: Publish DB if changed
        if: ${{ !cancelled() }}
        working-directory: backend
        run: bash ../.github/scripts/publish_db.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
